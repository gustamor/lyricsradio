plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'net.laenredadera.app.android.lyricsradio'
    compileSdk 35

    defaultConfig {
        applicationId "net.laenredadera.app.android.lyricsradio"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "$kotlin_version"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0' // required to avoid crash on Android 12 API 31
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.appcompat:appcompat-resources:1.7.0'

    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.runtime:runtime-livedata:$compose_ui_version"
    implementation 'androidx.compose.material3:material3'
    implementation "io.coil-kt:coil:2.4.0"
    implementation 'io.coil-kt:coil-compose:2.4.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.5"

    //Drawable Painter
    implementation "com.google.accompanist:accompanist-drawablepainter:$accompanist_version"

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //Dagger Hilt
    implementation "com.google.dagger:hilt-android:$hilt_verson"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_verson"
    implementation 'androidx.appcompat:appcompat-resources:1.7.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    // Cuando usas Kotlin
    ksp 'androidx.hilt:hilt-compiler:1.2.0'


    //Media3
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    //Fonts
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.7.6'

    // Room components
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-common:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation "androidx.room:room-testing:2.6.1"

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.3.1'
    // required if you want to use Mockito for Android tests
    androidTestImplementation 'org.mockito:mockito-android:5.3.1'
    // Hilt for testing
    testImplementation 'com.google.dagger:hilt-android-testing:2.46.1'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.46.1'
    kspTest "com.google.dagger:hilt-android-compiler:$hilt_verson"
}